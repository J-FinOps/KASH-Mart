# ============================================================
# Hadoop Configuration ConfigMap for Worker Pods
# ============================================================
# 이 ConfigMap은 HDFS/HAAdoop 설정 파일을 K8s Worker Pod에 주입하여,
# Pod에서 외부 Docker Hadoop 클러스터에 접근할 수 있도록 합니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hadoop-config
  namespace: airflow
  labels:
    app: airflow
    component: hadoop-client
data:
  core-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
        <property>
            <name>fs.defaultFS</name>
            <value>hdfs://172.17.0.1:9820</value>
        </property>
    </configuration>

  hdfs-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
        <property>
            <name>dfs.client.use.datanode.hostname</name>
            <value>true</value>
        </property>
        <property>
            <name>dfs.replication</name>
            <value>1</value>
        </property>
    </configuration>

  yarn-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
        <property>
            <name>yarn.resourcemanager.hostname</name>
            <value>172.17.0.1</value>
        </property>
        <property>
            <name>yarn.resourcemanager.address</name>
            <value>172.17.0.1:8032</value>
        </property>
        <property>
            <name>yarn.resourcemanager.scheduler.address</name>
            <value>172.17.0.1:8030</value>
        </property>
        <property>
            <name>yarn.resourcemanager.resource-tracker.address</name>
            <value>172.17.0.1:8031</value>
        </property>
        <property>
            <name>yarn.nodemanager.aux-services</name>
            <value>mapreduce_shuffle</value>
        </property>
    </configuration>

  spark-defaults.conf: |
    spark.master                 yarn
    spark.submit.deployMode      client
    spark.yarn.queue             default
    spark.driver.memory          1g
    spark.executor.memory        1g
    spark.dynamicAllocation.enabled true
    spark.hadoop.fs.defaultFS    hdfs://172.17.0.1:9820
